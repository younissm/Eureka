services:
  - type: web
    name: eureka-backend
    env: python
    region: oregon
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: cd backend && gunicorn ecommerce.wsgi --bind 0.0.0.0:8000 --workers 3
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: eureka-backend.onrender.com,eureka.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://eureka-frontend.onrender.com,https://eureka.onrender.com

  - type: static
    name: eureka-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend-proto && npm install && npm run build
    staticPublishPath: frontend-proto/dist
    envVars:
      - key: VITE_API_URL
        value: https://eureka-backend.onrender.com
