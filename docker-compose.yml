version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: eureka-backend
    command: python backend/manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=ecommerce.settings
      - DATABASE_URL=sqlite:///db.sqlite3
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - ./backend:/app/backend
    working_dir: /app
    networks:
      - eureka-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: eureka-frontend
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend-proto:/app/frontend
      - /app/frontend/node_modules
    working_dir: /app/frontend
    depends_on:
      - backend
    networks:
      - eureka-network

networks:
  eureka-network:
    driver: bridge

volumes:
  db_data:
