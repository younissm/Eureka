services:
  - type: web
    name: eureka-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: cd backend && pip install -r requirements.txt && python manage.py migrate --noinput
    startCommand: cd backend && gunicorn ecommerce.wsgi --bind 0.0.0.0:8000 --workers 3
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: eureka-backend.onrender.com,eureka.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: eureka-postgres
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://eureka-frontend.onrender.com,https://eureka.onrender.com
    disk:
      name: eureka-backend-disk
      mountPath: /app
      sizeGB: 10

  - type: static
    name: eureka-frontend
    env: static
    region: oregon
    plan: standard
    buildCommand: cd frontend && npm install && npm run build:production
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://eureka-backend.onrender.com

databases:
  - name: eureka-postgres
    databaseName: eureka
    user: eureka_user
    region: oregon
    plan: standard
